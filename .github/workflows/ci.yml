name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the API
        working-directory: api
        run: mvn -B package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the frontend
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Verify the API jar exists
        run: test -f api/target/lumina-api.jar && echo "✅ build OK"
