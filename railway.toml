# Railway config — the simplest cloud deploy for this app.
# Railway has a one-click MySQL plugin, so the whole stack is:
#   Railway MySQL (plugin) + this web service (API + frontend in one image).

[build]
builder = "DOCKERFILE"
dockerfilePath = "api/Dockerfile"

[deploy]
startCommand = "java -jar /app/app.jar"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 120

# The platform injects PORT automatically — the app reads ${PORT:3001}.
